name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: reviewroom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: mysql://ci:ci-password@127.0.0.1:3306/reviewroom
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes
      WEB_ORIGIN: http://localhost:5000
      API_INTERNAL_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
